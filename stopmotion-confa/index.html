<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Стопмоушен конфа</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <!-- no src here: play from local blob so seek/loop work in Android WebView -->
  <video id="v" muted autoplay playsinline webkit-playsinline preload="auto"></video>
  <script>
    (function () {
      var VIDEO_PATH = "stopmotion-confa.mp4";
      var MEDIA_CACHE = "stopmotion-confa-media-v2";
      var video = document.getElementById("v");
      var blobUrl = null;
      var starting = false;

      function kick() {
        if (starting) return;
        starting = true;
        var p = video.play();
        if (p && typeof p.then === "function") {
          p.then(function () { starting = false; }).catch(function () { starting = false; });
        } else {
          starting = false;
        }
      }

      function restart() {
        if (starting) return;
        try { video.currentTime = 0; } catch (e) {}
        kick();
      }

      // Blob playback: do not use native loop (unreliable in Android WebView).
      video.loop = false;
      video.addEventListener("ended", restart);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) kick();
      });
      setInterval(function () {
        if (video.error || !blobUrl) return;
        if (video.ended) restart();
        else if (video.paused && video.readyState >= 2) kick();
      }, 500);

      function playBlob(blob) {
        if (blobUrl) {
          try { URL.revokeObjectURL(blobUrl); } catch (e) {}
        }
        blobUrl = URL.createObjectURL(blob);
        video.src = blobUrl;
        video.load();
        kick();
      }

      function fromNetwork() {
        return fetch(VIDEO_PATH, { cache: "force-cache" }).then(function (res) {
          if (!res.ok) throw new Error("video fetch " + res.status);
          var clone = res.clone();
          if (window.caches) {
            caches.open(MEDIA_CACHE).then(function (cache) {
              cache.put(VIDEO_PATH, clone);
            }).catch(function () {});
          }
          return res.blob();
        });
      }

      function fromCache() {
        if (!window.caches) return Promise.reject();
        return caches.open(MEDIA_CACHE).then(function (cache) {
          return cache.match(VIDEO_PATH).then(function (hit) {
            if (!hit) throw new Error("no cache");
            return hit.blob();
          });
        });
      }

      fromCache()
        .catch(function () { return fromNetwork(); })
        .then(function (blob) {
          playBlob(blob);
          // Refresh cache in background when we started from cache.
          fromNetwork().then(function (fresh) {
            if (fresh && fresh.size && blob && fresh.size !== blob.size) playBlob(fresh);
          }).catch(function () {});
        })
        .catch(function () {
          // Last resort: direct URL (may not loop well offline).
          video.src = VIDEO_PATH;
          video.load();
          kick();
        });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js?v=2").catch(function () {});
      }
    })();
  </script>
</body>
</html>
