<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Стопмоушен конфа</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    video {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video
    id="v"
    src="stopmotion-confa.mp4"
    muted
    autoplay
    playsinline
    webkit-playsinline
    preload="auto"
  ></video>
  <script>
    (function () {
      // Seek (currentTime=0.1) на этом mp4 даёт MEDIA_ERR_DECODE.
      // Рестарт: video.load() + play(). Hold последнего кадра — 3с.
      var video = document.getElementById("v");
      var HOLD_MS = 3000;
      var FALLBACK_DUR = 5.48;
      var timer = null;
      var holdTimer = null;
      var starting = false;

      video.loop = false;
      video.muted = true;

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js?v=7").catch(function () {});
      }

      function clearT() {
        if (timer) { clearTimeout(timer); timer = null; }
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      }

      function arm() {
        clearT();
        var dur = (video.duration && isFinite(video.duration) && video.duration > 0.5)
          ? video.duration
          : FALLBACK_DUR;
        var playMs = Math.max(500, dur * 1000 - 80);

        timer = setTimeout(function () {
          try { video.pause(); } catch (e) {}
          holdTimer = setTimeout(function () {
            restart();
          }, HOLD_MS);
        }, playMs);
      }

      function restart() {
        if (starting) return;
        starting = true;
        clearT();

        try { video.pause(); } catch (e) {}
        video.muted = true;

        function go() {
          video.removeEventListener("loadeddata", go);
          var p = video.play();
          if (p && p.then) {
            p.then(function () {
              starting = false;
              arm();
            }).catch(function () {
              starting = false;
              setTimeout(restart, 700);
            });
          } else {
            starting = false;
            arm();
          }
        }

        video.addEventListener("loadeddata", go);
        video.load();

        video.onerror = function () {
          video.removeEventListener("loadeddata", go);
          starting = false;
          setTimeout(restart, 800);
        };
      }

      var p0 = video.play();
      if (p0 && p0.then) {
        p0.then(arm).catch(restart);
      } else {
        arm();
      }
    })();
  </script>
</body>
</html>
